name: TAO CI/CD Gatekeeper

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  adversarial-audit:
    name: Adversarial Oversight & Empirical Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate PR Diff
        run: |
          git diff origin/${{ github.base_ref }} HEAD > pr.diff
          echo "Generated diff size: $(wc -c < pr.diff) bytes"

      - name: Run TAO Empirical Debate Gatekeeper
        id: tao_gatekeeper
        run: |
          python -m backend.cli audit-diff --file pr.diff --threshold 0.90 > tao_report.md
          cat tao_report.md

      - name: Comment TAO Audit Receipt on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('tao_report.md')) {
              const body = fs.readFileSync('tao_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
